name: Dependency audit

# P25-04: every locked package (uv.lock, pnpm-lock.yaml) against OSV, plus `pnpm audit --prod`, and
# the pinned downloads / Docker base digest still resolving. A high or critical finding fails unless
# tooling/checks/deps_audit_allow.json lists it with a reason and an expiry that has not passed.
# Runs when a lock or the audit itself changes, weekly (new advisories appear without a commit), and
# by hand. The offline guard in ci.yml reads the committed snapshot; this job asks the network.

on:
  pull_request:
    paths:
      - uv.lock
      - pnpm-lock.yaml
      - pyproject.toml
      - "**/package.json"
      - scripts/install/pins.json
      - docker/pins.json
      - tooling/checks/deps_audit*
      - .github/workflows/deps-audit.yml
  push:
    branches: [main]
    paths:
      - uv.lock
      - pnpm-lock.yaml
      - tooling/checks/deps_audit*
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      # No install: the audit reads the lock files only (pnpm audit works from the lock).
      - name: Audit (OSV + pnpm audit + pinned downloads)
        run: >-
          uv run --no-project --python 3.13 python -m tooling.checks.deps_audit
          --refresh --pnpm-audit --resolve-pins --no-write

      - name: Report
        if: always()
        run: >-
          uv run --no-project --python 3.13 python -m tooling.checks.deps_audit
          --refresh --pnpm-audit --report --no-write >> "$GITHUB_STEP_SUMMARY"
