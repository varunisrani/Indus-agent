name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REF_REPOSITORY_URL: https://github.com/NousResearch/hermes-agent.git
  REF_COMMIT: ab3fe9dffb0a89d534cb795e2a2940e5f6542056

jobs:
  # Python lint, types, tests and every repo guard (clean room, pins, locales).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The reference is fetched outside the workspace so it can never be committed by accident.
      - name: Fetch the pinned reference
        working-directory: ${{ runner.temp }}
        run: |
          git init --quiet ref
          git -C ref fetch --quiet --depth 1 "$REF_REPOSITORY_URL" "$REF_COMMIT"
          git -C ref checkout --quiet --detach FETCH_HEAD
          actual="$(git -C ref rev-parse HEAD)"
          if [ "$actual" != "$REF_COMMIT" ]; then
            echo "reference is at $actual, expected $REF_COMMIT" >&2
            exit 1
          fi
          echo "INDUS_REF=${RUNNER_TEMP}/ref" >> "$GITHUB_ENV"

      - name: Cache the reference index
        uses: actions/cache@v4
        with:
          path: ~/.cache/indus-checks
          key: indus-checks-${{ env.REF_COMMIT }}-${{ hashFiles('tooling/checks/**/*.py') }}

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Layer contracts
        run: uv run lint-imports

      - name: Types
        run: uv run pyright

      - name: Tests
        run: uv run pytest -q -m "not perf"

      # D-04.1 wall-clock bounds are only meaningful without other tests competing for the CPU.
      - name: Perf bounds (serial, alone)
        run: uv run pytest -q -m perf

      # R10.22: a pull request is judged by the policy files of its base branch, so it cannot
      # loosen the guard that judges it. A policy change applies from the next pull request on.
      - name: Read guard policy from the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --no-tags --depth 1 origin "$BASE_SHA"
          uv run python -m tooling.checks.policy --base "$BASE_SHA"

      - name: Repo guards
        run: uv run python -m tooling.checks --require-ref

      - name: PR body has Reference and Task note lines
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          body_file="${RUNNER_TEMP}/pr-body.md"
          printf '%s\n' "$PR_BODY" > "$body_file"
          uv run python -m tooling.checks.prbody --body-file "$body_file"

  # The newest interpreter inside requires-python, from the same lock.
  py314:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Tests on Python 3.14
        run: uv run --locked --python 3.14 pytest -q -m "not perf"

  # The adapter matrix (P16-36, the M5 criterion): the shared contract suite over every registered
  # platform's wire fake, plus the gate that fails, naming the platform, when one lacks a wire fake
  # or a contract run (tests/contract/gateway/test_adapter_matrix.py). No extras: every adapter must
  # pass over its fake without its SDK; the vendor-name drift rows run in the extras lane.
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Adapter matrix and contract suite
        run: uv run pytest tests/contract/gateway -q -m "not perf" -p no:randomly

  # Demo 1 (P06-14): the real `indus` in a pseudo-terminal against the fake model, on Linux and
  # macOS (pty and signal behaviour differ between them).
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: End-to-end tests
        run: uv run pytest tests/e2e -q

  # TypeScript workspace: Biome, tsc, vitest.
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm comes from the packageManager field of package.json.
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm fmt:check

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

  # The only required status. It needs every other job and is green only when each of them
  # succeeded: skipped, cancelled and failed all fail the gate (R10.18).
  gate:
    needs:
      - checks
      - py314
      - adapters
      - e2e
      - ts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::jobs that did not succeed: $bad"
            exit 1
          fi
