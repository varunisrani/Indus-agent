# Indus Agent: English catalogue, the source every other locales/<lang>.yaml must mirror.
# Keys are nested by section; placeholders are written {name}. Quote a value that starts with {,
# contains ": " or would read as a number, boolean or null.

common:
  ok: OK
  cancel: Cancel
  confirm: "Continue? [y/N]"
  done: Done.
  unknown: unknown
  path_label: "Path: {path}"

cli:
  version: indus {version}
  help_hint: Run "indus --help" to list every command.
  interrupted: Interrupted. Press Ctrl+C again to quit.
  home_created: Created your Indus home at {path}.
  unknown_command: There is no command called {name}. Run "indus --help" to see what exists.
  doctor:
    title: "Indus Agent doctor (minimal report)"
    home: "home: {path} (profile {profile}, selected by {how})"
    config: "config: {path} (version {version}; {user} set by you, {defaults} at defaults)"
    config_absent: "config: {path} (no file yet; all {defaults} settings at defaults)"
    config_key: "  {key}: {source}"
    config_broken: "  the file could not be read, the last good settings are used: {reason}"
    secrets: "secrets: {backend} backend (setting {mode}; keychain {keychain})"
    keychain_yes: "available"
    keychain_no: "not available"
    store: "store: {state}"
    store_details: "store: {state} ({mode}, schema {schema}, fts5 {fts5}, trigram {trigram})"
    store_file: "  file: {path}"
    store_sqlite: "  SQLite {version} (fts5 {fts5}, trigram {trigram})"
    store_line: "  {line}"
    logs: "logs: {path}"
    word_yes: "yes"
    word_no: "no"
    failed: "doctor could not start: {reason}"
    usage: "usage: python -m indus.state.doctor_report [-p NAME] [--json]"

errors:
  generic: Something went wrong. The log at {log_path} has the details.
  config:
    unreadable: "Could not read the config file at {path}: {reason}"
    invalid_value: Setting {key} cannot be {value}. Allowed values are {allowed}.
    unknown_key: The config file sets {key}, which Indus Agent does not know. Remove it or check the spelling.
  store:
    locked:
      what: "Another Indus process was busy writing to your session history."
      todo: "Nothing is damaged. Wait a moment and try again."
    disk:
      what: "Your session history could not be saved because of a disk problem."
      todo: "Free some disk space or fix the folder permissions, then try again."
    compression:
      what: "This conversation was being condensed when the message arrived."
      todo: "Send it again in a few seconds."
    compression_closed:
      what: "This conversation continued in a newer segment."
      todo: "Your client will switch to the newer segment; nothing was lost."
    turn_lease:
      what: "Another process took over this conversation."
      todo: "Reload the conversation to see its latest state."
    corrupt:
      what: "The session history file is damaged, so saving was stopped to protect it."
      todo: "Quit Indus Agent and run `indus doctor` for recovery steps."
    fts_index:
      what: "The search index is damaged; your conversations are safe."
      todo: "Search uses a slower method until the index is rebuilt. Run `indus doctor`."
    replaced:
      what: "The session history file was swapped while Indus Agent was running."
      todo: "Unsaved messages are in the sessions folder of your home. Restart Indus Agent."
    session_row_missing:
      what: "This conversation was deleted while it was still open."
      todo: "Start a new conversation."
    unknown:
      what: "Your session history could not be saved."
      todo: "Try again; if it keeps happening, run `indus doctor`."
    too_new: The session store at {path} was written by a newer version of Indus Agent.
    uninitialised:
      what: "The session history file exists but was never set up."
      todo: "Start Indus Agent once to set it up, or move the file away if it is not yours."
    incompatible:
      what: "The session history was written by a newer version of Indus Agent."
      todo: "Update Indus Agent to read it."
  secrets:
    missing: No value is stored for {name}. Set it with "indus secrets set {name}".
