# Indus Agent: English catalogue, the source every other locales/<lang>.yaml must mirror.
# Keys are nested by section; placeholders are written {name}. Quote a value that starts with {,
# contains ": " or would read as a number, boolean or null.

common:
  ok: OK
  cancel: Cancel
  confirm: "Continue? [y/N]"
  done: Done.
  unknown: unknown
  path_label: "Path: {path}"

cli:
  version: indus {version}
  help_hint: Run "indus --help" to list every command.
  interrupted: Interrupted. Press Ctrl+C again to quit.
  home_created: Created your Indus home at {path}.
  unknown_command: There is no command called {name}. Run "indus --help" to see what exists.
  doctor:
    title: "Indus Agent doctor (minimal report)"
    home: "home: {path} (profile {profile}, selected by {how})"
    config: "config: {path} (version {version}; {user} set by you, {defaults} at defaults)"
    config_absent: "config: {path} (no file yet; all {defaults} settings at defaults)"
    config_key: "  {key}: {source}"
    config_broken: "  the file could not be read, the last good settings are used: {reason}"
    secrets: "secrets: {backend} backend (setting {mode}; keychain {keychain})"
    keychain_yes: "available"
    keychain_no: "not available"
    store: "store: {state}"
    store_details: "store: {state} ({mode}, schema {schema}, fts5 {fts5}, trigram {trigram})"
    store_file: "  file: {path}"
    store_sqlite: "  SQLite {version} (fts5 {fts5}, trigram {trigram})"
    store_line: "  {line}"
    logs: "logs: {path}"
    word_yes: "yes"
    word_no: "no"
    failed: "doctor could not start: {reason}"
    usage: "usage: python -m indus.state.doctor_report [-p NAME] [--json]"

prompt:
  context_truncated: "Context file {name} was shortened: it has {total} characters and the limit is {cap}. Trim the file, raise prompt.context_file_max_chars, or use a model with a larger window."

errors:
  generic: Something went wrong. The log at {log_path} has the details.
  config:
    unreadable: "Could not read the config file at {path}: {reason}"
    invalid_value: Setting {key} cannot be {value}. Allowed values are {allowed}.
    unknown_key: The config file sets {key}, which Indus Agent does not know. Remove it or check the spelling.
  store:
    locked:
      what: "Another Indus process was busy writing to your session history."
      todo: "Nothing is damaged. Wait a moment and try again."
    disk:
      what: "Your session history could not be saved because of a disk problem."
      todo: "Free some disk space or fix the folder permissions, then try again."
    compression:
      what: "This conversation was being condensed when the message arrived."
      todo: "Send it again in a few seconds."
    compression_closed:
      what: "This conversation continued in a newer segment."
      todo: "Your client will switch to the newer segment; nothing was lost."
    turn_lease:
      what: "Another process took over this conversation."
      todo: "Reload the conversation to see its latest state."
    corrupt:
      what: "The session history file is damaged, so saving was stopped to protect it."
      todo: "Quit Indus Agent and run `indus doctor` for recovery steps."
    fts_index:
      what: "The search index is damaged; your conversations are safe."
      todo: "Search uses a slower method until the index is rebuilt. Run `indus doctor`."
    replaced:
      what: "The session history file was swapped while Indus Agent was running."
      todo: "Unsaved messages are in the sessions folder of your home. Restart Indus Agent."
    session_row_missing:
      what: "This conversation was deleted while it was still open."
      todo: "Start a new conversation."
    unknown:
      what: "Your session history could not be saved."
      todo: "Try again; if it keeps happening, run `indus doctor`."
    too_new: The session store at {path} was written by a newer version of Indus Agent.
    uninitialised:
      what: "The session history file exists but was never set up."
      todo: "Start Indus Agent once to set it up, or move the file away if it is not yours."
    incompatible:
      what: "The session history was written by a newer version of Indus Agent."
      todo: "Update Indus Agent to read it."
  secrets:
    missing: No value is stored for {name}. Set it with "indus secrets set {name}".
  session:
    busy:
      what: "This conversation is busy: a reply is still running, or another Indus Agent window has it open."
      todo: "Wait for the reply to finish, or close the other window, then try again."

turn:
  overflow: "The conversation no longer fits this model's context window, so the partial reply was not continued. Compress the conversation or start a new session."
  repetition: "The model got stuck repeating itself, so the reply was stopped. Send the message again, or switch to another model."
  thinking_exhausted: "The model spent its whole output budget on reasoning and wrote no answer. Lower the reasoning effort or raise the output limit."
  ceiling_no_text: "The reply hit the output limit on every attempt and no visible text came back. Lower the reasoning effort or raise the output limit."
  window_full: "The prompt used {prompt} of the model's {window}-token context window, leaving no room for an answer. Compress the conversation or start a new session."
  tool_call_cut: "The model's tool call was cut off several times in a row, so it was not run."
  dropped_tools: "The stream broke while a tool call was being written ({names}); it was not run."
  empty: "The model returned no answer after several attempts. Send the message again, or switch to another model."
  heal_notice: "Some earlier turns in this session are empty and get patched on every request. Replies still work; start a new session to clear them."

# Slash-command descriptions; the English also lives in src/indus/service/commands/registry.py
# (a test keeps the two equal).
slash:
  new: "Start a fresh session; add a name to title it, 'now' or -y to skip the question"
  clear: "Clear the screen and start a fresh session"
  history: "Show this conversation so far"
  title: "Show or set the title of this session"
  resume: "Switch to an earlier session by title, id or list number"
  sessions: "List recent sessions to pick one to resume"
  retry: "Take back your last message and send it again"
  undo: "Take back your last N messages and their replies (default 1)"
  save: "Write this conversation to a file as JSON lines, Markdown or HTML"
  branch: "Copy this conversation into a new session and continue there"
  stop: "Stop the running reply and this session's background processes"
  steer: "Add guidance to the running reply after its next tool call"
  queue: "Line up a message for after the current reply; list, clear or remove queued ones"
  compress: "Summarise older turns to free context"
  status: "Show the session, model and approval state"
  context: "Show how much of the context window is in use"
  btw: "Ask a side question without changing the conversation"
  goal: "Set a standing goal the agent keeps working towards"
  subgoal: "Add or remove extra criteria on the current goal"
  loop: "Repeat a prompt in this session on an interval"
  heartbeat: "Send a recurring prompt into this session while it is idle"
  moa: "Answer one prompt with several models, then return to yours"
  agents: "Show running helper agents and background tasks"
  refine: "Review this conversation now and keep what was learned"
  journey: "Browse what the agent has learned over time"
  rollback: "List or restore file checkpoints"
  worktree: "Create, list or prune isolated git worktrees"
  approve: "Approve the command waiting for an answer"
  deny: "Refuse the command waiting for an answer"
  model: "Show or switch the model; --global also saves it"
  reasoning: "Show or set reasoning effort, or show/hide reasoning text"
  yolo: "Turn auto-approval of risky commands on or off for this session"
  approvals: "Show or save how risky commands are approved"
  fast: "Ask the provider for faster processing"
  config: "Show the effective settings with secrets masked"
  voice: "Turn voice input and spoken replies on or off"
  tools: "List tools, or enable/disable toolsets (starts a fresh session)"
  skills: "Find, install and manage skills"
  reload-skills: "Rescan skill folders and refresh skill commands (the prompt stays as it is)"
  bundles: "List skill bundles (each runs as its own /command)"
  memory: "Review memory writes waiting for approval"
  learn: "Turn something you describe into a reusable skill"
  curator: "Background upkeep of skills"
  browser: "Connect the browser tools to a running browser"
  checkpoints: "Turn file checkpoints on or off"
  mcp: "Show connected MCP servers"
  reload-mcp: "Reconnect MCP servers from the config"
  plugins: "List installed plugins"
  cron: "Manage scheduled jobs"
  help: "List commands; add a word to filter them"
  usage: "Show token use and cost of this session"
  whoami: "Show the profile, home and session you are on"
  version: "Show the Indus Agent version"
  quit: "Leave Indus Agent"
