[project]
name = "indus-agent"
version = "0.0.1"
description = "Indus Agent: a self-improving AI agent (pre-alpha)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
indus = "indus.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indus"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "tooling/checks/tests"]
addopts = "--strict-markers"
markers = [
    "slow: takes more than a few seconds",
    "ref: needs the pinned reference checkout (INDUS_REF)",
    "network: needs network access",
]
