[project]
name = "indus-agent"
version = "0.0.1"
description = "Indus Agent: a self-improving AI agent (pre-alpha)."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anyio==4.15.1",
    "click==8.5.0",
    "croniter==6.2.4",
    # HTTP surfaces of the gateway daemon: API server and webhook receiver (P15-30..32; MIT, BSD-3).
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "keyring==25.7.0",
    "mcp==2.3.0",
    "prompt_toolkit==3.0.53",
    "pydantic==2.13.5",
    "rich==15.0.0",
    "ruamel.yaml==0.19.1",
    "uvicorn==0.54.0",
    # WebSocket support for uvicorn: the daemon's attach endpoint (P17-13; MIT).
    "wsproto==1.3.2",
]

[project.optional-dependencies]
# Keyless DuckDuckGo search for web_search (P05-23; MIT, 00-layout section 4).
web = ["ddgs==9.16.0"]
# Document readers for read_file (P05-17; BSD-3-Clause, MIT, MIT; 00-layout section 4).
docs = ["openpyxl==3.1.5", "pypdf==6.19.0", "python-docx==1.2.0"]
# Pseudo-terminals for interactive background processes (P05-13; ISC, 00-layout section 4).
pty = ["ptyprocess==0.7.0"]
# The dashboard's Chat tab terminal (P18-07): ptyprocess on POSIX (ISC) and ConPTY through pywinpty
# on Windows only (MIT); 00-layout section 4. Imported lazily by indus.web.pty.bridge.
dashboard = ["ptyprocess==0.7.0", "pywinpty==3.0.5; sys_platform == 'win32'"]
# Headless Chromium for the browser tools (P10-12; Apache-2.0, 00-layout section 4).
browser = ["playwright==1.63.0"]
# Local speech to text for the STT library (P10-18; MIT) and the microphone/speaker library for
# CLI voice mode (P10-19; MIT, needs cffi); 00-layout section 4.
voice = ["faster-whisper==1.2.1", "sounddevice==0.5.6"]
# Cloud sandbox SDKs for the terminal backends (P21; Apache-2.0, Apache-2.0, MIT;
# docs/notes/P21/sdk-versions.md). Imported lazily by their backend only.
modal = ["modal==1.6.1"]
daytona = ["daytona==0.220.0"]
vercel = ["vercel-sandbox==0.7.0"]
# Tokenizer and dataset loading for `indus research compress` / `sample` (P22-11, P22-15;
# Apache-2.0, Apache-2.0; docs/notes/P22/compress-config.md). Imported lazily only.
research = ["datasets==5.0.1", "transformers==5.17.0"]
# Discord gateway adapter (P15-34; MIT, brings audioop-lts PSF-2.0 on Python 3.13+;
# docs/notes/P15/discord.md). Imported lazily by the adapter only.
discord = ["discord.py==2.7.1"]
# Discord voice channels (P16-35): discord.py's own `voice` extra on the same pin, which brings
# PyNaCl (Apache-2.0, bundles libsodium, ISC; voice transport encryption) and davey (MIT; Discord's
# DAVE end-to-end voice encryption). libopus and ffmpeg come from the system. Imported lazily by
# discord/voice.py only, after `/voice join`; docs/notes/P16/discord-voice.md.
discord-voice = ["discord.py[voice]==2.7.1"]
# Slack Socket Mode adapter (P15-35; MIT, MIT, Apache-2.0 AND MIT). Bolt's async app and Socket Mode
# handler import aiohttp, which slack-sdk lists only as an optional extra. Imported lazily only.
slack = ["slack-bolt==1.30.0", "slack-sdk==3.44.1", "aiohttp==3.14.3"]
# Event socket of the Mattermost adapter (P16-08; MIT, needs wsproto MIT; both already locked through
# the daytona extra). REST and Matrix (P16-06) use httpx only. Imported lazily by the adapter.
mattermost = ["httpx-ws==0.9.0"]
# Google Chat (P16-13; Apache-2.0 OR BSD-3-Clause, needs cffi MIT-0 and pycparser BSD-3-Clause; all
# already locked via keyring's SecretStorage and mcp's pyjwt[crypto]): RS256 for the service-account
# assertion and Google's callback tokens. Chat and Pub/Sub REST run on httpx. Imported lazily.
google-chat = ["cryptography==50.0.2"]
# QQ Bot gateway socket (P16-20; MIT, needs wsproto MIT; both already locked). REST runs on httpx.
# Imported lazily by the adapter.
qqbot = ["httpx-ws==0.9.0"]
# DingTalk Stream Mode socket (P16-16; our own Stream Mode client over httpx + httpx-ws, MIT, no
# dingtalk-stream SDK). REST and `indus send` need only httpx. Imported lazily by the adapter.
dingtalk = ["httpx-ws==0.9.0"]
# WeCom: the smart-robot socket (P16-17, httpx-ws MIT) and AES for the callback crypto and media
# (P16-18; cryptography Apache-2.0 OR BSD-3-Clause, already locked via keyring/SecretStorage on
# Linux). Both imported lazily.
wecom = ["httpx-ws==0.9.0", "cryptography==50.0.2"]
# The Feishu / Lark long connection (P16-14; MIT, needs wsproto MIT; both already locked). REST,
# webhook mode and the document tools use httpx only; lark-oapi is not used (docs/notes/P16/feishu.md).
feishu = ["httpx-ws==0.9.0"]
# SimpleX daemon socket (P16-28; httpx-ws MIT, already locked). The SimpleX CLI itself (AGPL-3.0)
# is never a dependency: the user runs it. Imported lazily by the adapter only.
simplex = ["httpx-ws==0.9.0"]
# Buzz Nostr relay (P16-29): BIP-340 signing and verification through coincurve (MIT OR Apache-2.0,
# wraps libsecp256k1, MIT; no runtime dependencies) and the relay socket through httpx-ws (MIT).
# Imported lazily by the adapter only; docs/notes/P16/buzz.md.
buzz = ["coincurve==21.0.0", "httpx-ws==0.9.0"]
# Matrix end-to-end encryption (P16-07), Linux only: mautrix's crypto layer (MPL-2.0, used
# unmodified) over python-olm (Apache-2.0; bundles libolm, Apache-2.0; no cp313 wheel, so it builds
# from the sdist with cmake and a C++ compiler), with pycryptodome (BSD-2-Clause / public domain),
# unpaddedbase64 (Apache-2.0), base58 (MIT), aiosqlite (MIT) for the SQLite device store and
# asyncpg (Apache-2.0; mautrix's store module imports it). Imported lazily by
# matrix/crypto.py only; docs/notes/P16/matrix-e2ee.md.
matrix-e2ee = [
    "mautrix==0.21.1; sys_platform == 'linux'",
    "python-olm==3.2.16; sys_platform == 'linux'",
    "pycryptodome==3.23.0; sys_platform == 'linux'",
    "unpaddedbase64==2.1.0; sys_platform == 'linux'",
    "base58==2.1.1; sys_platform == 'linux'",
    "aiosqlite==0.22.1; sys_platform == 'linux'",
    "asyncpg==0.31.0; sys_platform == 'linux'",
]
# Weixin (P16-19): AES-128-ECB for media, the iLink protocol's own scheme, through cryptography
# (Apache-2.0 OR BSD-3-Clause, already locked). The iLink client runs on httpx. Imported lazily.
weixin = ["cryptography==50.0.2"]
# Yuanbao bot socket (P16-21; httpx-ws MIT, needs wsproto MIT; both already locked). Sign tokens,
# uploads and media run on httpx; HMAC through the stdlib. Imported lazily by the adapter only.
yuanbao = ["httpx-ws==0.9.0"]
# Editor agent over the Agent Client Protocol (P19-01; agent-client-protocol Apache-2.0, LICENSE read
# at the 0.12.1 sdist; needs pydantic only). Imported lazily by `indus acp` only.
acp = ["agent-client-protocol==0.12.1"]

[project.scripts]
indus = "indus.cli.entry:main"

[dependency-groups]
dev = [
    # The ACP SDK for the adapter's tests (P19), so the gate runs them without the `acp` extra.
    "agent-client-protocol==0.12.1",
    "import-linter==2.15",
    "pexpect==4.9.0",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "respx==0.23.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indus"]

[tool.hatch.build.targets.wheel.force-include]
# P09-21: the starter skills ship inside the package (bundled_sync.bundled_source).
"skills" = "indus/_bundled_skills"

[tool.uv]
# 14-day age window (D-16.52): nothing uploaded after this instant is locked. Checked against
# tooling/checks/pins_meta.json lock_date by the pins guard; bump both together.
exclude-newer = "2026-10-04T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py313"
# Fixture files are data: a notebook fixture must keep its cells byte for byte.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID251"]

# No real sleeps: code that waits takes a Clock; tests use tests/fakes/clock.FakeClock.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "inject a Clock (tests: tests.fakes.clock.FakeClock)"
"asyncio.sleep".msg = "inject a Clock (tests: tests.fakes.clock.FakeClock / checkpoint())"

[tool.ruff.lint.per-file-ignores]
"src/indus/foundation/clock.py" = ["TID251"]
"tests/fakes/clock.py" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests", "tooling/checks/tests"]
addopts = "--strict-markers"
markers = [
    "slow: takes more than a few seconds",
    "perf: asserts wall-clock bounds (D-04.1 criteria); numbers are only meaningful run alone",
    "ref: needs the pinned reference checkout (INDUS_REF)",
    "network: needs network access",
    "docker: needs a reachable Docker daemon (live backend lanes, P11-21)",
    "live: talks to a real provider with a real key (INDUS_LIVE=1); skips cleanly without one",
    "browser: drives a real Chromium (the browser extra); skips cleanly without one",
]

[tool.importlinter]
root_package = "indus"

[[tool.importlinter.contracts]]
name = "Layer order (00-layout section 1)"
type = "layers"
layers = [
    "indus.cli | indus.tui_bridge | indus.gateway | indus.web | indus.acp | indus.mcp_serve",
    # Research tooling (P22) runs agents through the service and is used by the surfaces (CLI
    # verbs, the interactive trajectory saver), so it sits just below them.
    "indus.research",
    "indus.service",
    "indus.learning | indus.plugins | indus.mcp | indus.cron | indus.board",
    "indus.core",
    # Tools run commands and file operations through the backends (P05), never the reverse.
    "indus.tools",
    "indus.backends",
    "indus.providers | indus.safety | indus.pm",
    "indus.protocol | indus.state",
    "indus.foundation",
    "indus.platform",
]
# No exemptions: what two top-layer siblings share (the pairing store, the gateway routes index)
# lives below them, in indus.state or indus.service (lead rule, P15 wave 1; LEAD-NOTES).

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tests", "tooling"]
typeCheckingMode = "basic"
strict = [
    "src/indus/foundation",
    "src/indus/protocol",
    "src/indus/state",
    "src/indus/service",
    "src/indus/core",
]
reportMissingTypeStubs = false
