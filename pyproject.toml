[project]
name = "indus-agent"
version = "0.0.1"
description = "Indus Agent: a self-improving AI agent (pre-alpha)."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anyio==4.15.1",
    "click==8.5.0",
    "httpx==0.28.1",
    "keyring==25.7.0",
    "prompt_toolkit==3.0.53",
    "pydantic==2.13.5",
    "rich==15.0.0",
    "ruamel.yaml==0.19.1",
]

[project.optional-dependencies]
# Keyless DuckDuckGo search for web_search (P05-23; MIT, 00-layout section 4).
web = ["ddgs==9.16.0"]
# Document readers for read_file (P05-17; BSD-3-Clause, MIT, MIT; 00-layout section 4).
docs = ["openpyxl==3.1.5", "pypdf==6.19.0", "python-docx==1.2.0"]
# Pseudo-terminals for interactive background processes (P05-13; ISC, 00-layout section 4).
pty = ["ptyprocess==0.7.0"]

[project.scripts]
indus = "indus.cli.entry:main"

[dependency-groups]
dev = [
    "import-linter==2.15",
    "pexpect==4.9.0",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "respx==0.23.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indus"]

[tool.hatch.build.targets.wheel.force-include]
# P09-21: the starter skills ship inside the package (bundled_sync.bundled_source).
"skills" = "indus/_bundled_skills"

[tool.uv]
# 14-day age window (D-16.52): nothing uploaded after this instant is locked. Checked against
# tooling/checks/pins_meta.json lock_date by the pins guard; bump both together.
exclude-newer = "2026-10-04T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py313"
# Fixture files are data: a notebook fixture must keep its cells byte for byte.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID251"]

# No real sleeps: code that waits takes a Clock; tests use tests/fakes/clock.FakeClock.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "inject a Clock (tests: tests.fakes.clock.FakeClock)"
"asyncio.sleep".msg = "inject a Clock (tests: tests.fakes.clock.FakeClock / checkpoint())"

[tool.ruff.lint.per-file-ignores]
"src/indus/foundation/clock.py" = ["TID251"]
"tests/fakes/clock.py" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests", "tooling/checks/tests"]
addopts = "--strict-markers"
markers = [
    "slow: takes more than a few seconds",
    "perf: asserts wall-clock bounds (D-04.1 criteria); numbers are only meaningful run alone",
    "ref: needs the pinned reference checkout (INDUS_REF)",
    "network: needs network access",
    "docker: needs a reachable Docker daemon (live backend lanes, P11-21)",
    "live: talks to a real provider with a real key (INDUS_LIVE=1); skips cleanly without one",
]

[tool.importlinter]
root_package = "indus"

[[tool.importlinter.contracts]]
name = "Layer order (00-layout section 1)"
type = "layers"
layers = [
    "indus.cli | indus.tui_bridge | indus.gateway | indus.web | indus.acp | indus.mcp_serve | indus.research",
    "indus.service",
    "indus.learning | indus.plugins | indus.mcp | indus.cron | indus.board",
    "indus.core",
    # Tools run commands and file operations through the backends (P05), never the reverse.
    "indus.tools",
    "indus.backends",
    "indus.providers | indus.safety | indus.pm",
    "indus.protocol | indus.state",
    "indus.foundation",
    "indus.platform",
]

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tests", "tooling"]
typeCheckingMode = "basic"
strict = [
    "src/indus/foundation",
    "src/indus/protocol",
    "src/indus/state",
    "src/indus/service",
    "src/indus/core",
]
reportMissingTypeStubs = false
