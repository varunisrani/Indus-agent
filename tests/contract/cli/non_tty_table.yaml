# P07-26: what every `indus` command does with stdin and stdout not terminals (R04.19).
#
# `commands`: each visible command and subcommand, run with no further arguments, in a fresh
# profile (no settings, no keys, no sessions). The value is the exit code it must end with:
#   0 informational (it printed what there is), 1 guidance (it said what to run instead),
#   2 usage (a required argument is missing).
# A new command without a row fails the contract, and so does a row whose command is gone.
#
# `with_arguments`: guidance cases that need an argument to reach (argv → exit code).

commands:
  chat: 1                 # first-run guard: not set up, prints what to run
  model: 1
  fallback: 0
  fallback list: 0
  fallback add: 1
  fallback remove: 0
  fallback clear: 0
  setup: 0                # prints the non-interactive setup steps
  auth: 0                 # lists the pools and the subcommands
  auth add: 2
  auth list: 0
  auth remove: 2
  auth reset: 2
  auth priority: 2
  auth refresh: 2
  auth status: 2
  auth logout: 2
  status: 0
  doctor: 1               # a fresh profile has no settings file and no provider yet
  approvals: 0
  approvals test: 1
  dump: 0
  backup: 0               # writes the zip into the profile owner's home folder
  checkpoints: 0
  checkpoints status: 0
  checkpoints list: 0
  checkpoints prune: 0
  checkpoints clear: 0
  worktree: 1             # the fresh cwd is not inside a git repository
  worktree list: 1
  worktree new: 1
  worktree prune: 1
  import: 2
  config: 0
  config show: 0
  config get: 2
  config set: 2
  config unset: 2
  config edit: 1
  config check: 0
  config migrate: 0       # dry run
  config path: 0
  config env-path: 0
  tools: 0                # lists instead of the checklist
  tools list: 0
  tools enable: 2
  tools disable: 2
  sessions: 2             # a group with no default action prints its help
  sessions list: 0
  sessions browse: 0      # lists without a picker
  sessions pinned: 0
  sessions rename: 2
  sessions delete: 2
  sessions pin: 2
  sessions unpin: 2
  sessions stats: 0
  sessions export: 0
  sessions prune: 0
  sessions archive: 2     # refuses to archive everything without a filter
  sessions optimize: 0
  sessions repair: 0
  sessions recover: 2
  sessions import: 2
  profile: 0
  profile list: 0
  profile use: 2
  profile show: 2
  profile create: 2
  profile delete: 2
  profile rename: 2
  profile describe: 0
  profile alias: 2
  completion: 0           # bash by default
  logs: 1                 # no log file yet
  bundles: 2              # a group with no default action prints its help
  bundles list: 0         # says there are no bundles yet
  bundles show: 2
  bundles create: 2
  bundles delete: 2
  bundles reload: 0
  skills: 2               # a group with no default action prints its help
  skills list: 0          # says there are no skills yet
  skills view: 2
  skills check: 0
  skills list-modified: 0
  skills diff: 2
  skills sync: 0          # seeds the shipped skills into the fresh profile
  skills opt-out: 0
  skills opt-in: 0
  skills reset: 2
  skills pending: 0
  skills approve: 2
  skills reject: 2
  skills browse: 0        # P13-27: catalogue and taps only; empty in a fresh profile
  skills search: 2
  skills inspect: 2
  skills install: 2
  skills check-updates: 0 # no hub skills yet
  skills update: 2        # needs a name or --all
  skills audit: 0
  skills uninstall: 2
  skills tap: 2
  skills tap list: 0
  skills tap add: 2
  skills tap remove: 2
  skills trust: 2
  skills untrust: 2
  skills trust-project: 1 # P13-28: the fresh cwd is not inside a git repository
  memory: 2               # a group with no default action prints its help
  memory show: 0
  memory status: 0
  memory edit: 2
  memory pending: 0
  memory approve: 2
  memory reject: 2
  memory approval: 2
  memory setup: 0         # no provider installed: says so and exits 0
  memory off: 0
  curator: 2              # a group with no default action prints its help
  curator status: 0
  curator run: 0
  curator pause: 0
  curator resume: 0
  curator pin: 2
  curator unpin: 2
  curator adopt: 2
  curator list-unmanaged: 0
  curator archive: 2
  curator restore: 2
  curator list-archived: 0
  curator prune: 0        # nothing idle in a fresh profile
  curator purge: 0        # archive_ttl_days is 0: says purge is off
  curator backup: 1       # no skills folder yet
  curator rollback: 1     # no snapshots yet
  curator ledger: 0
  journey: 0
  journey list: 0
  journey delete: 2
  journey edit: 2
  learning: 0
  learning list: 0
  learning delete: 2
  learning edit: 2
  moa: 0                  # says there are no presets yet
  moa list: 0
  moa configure: 1        # no --reference and no terminal to pick models
  moa delete: 2
  mcp: 2                  # a group with no default action prints its help
  mcp list: 0
  mcp add: 2
  mcp test: 2
  mcp remove: 2
  mcp enable: 2
  mcp disable: 2
  mcp login: 2
  mcp configure: 2
  hooks: 2                # a group with no default action prints its help
  hooks list: 0           # no hooks configured: says so
  hooks test: 2           # EVENT is required
  hooks revoke: 2
  hooks doctor: 0         # nothing to check
  plugins: 2              # a group with no default action prints its help
  plugins list: 0
  plugins install: 2
  plugins update: 2       # a name or --all is required
  plugins remove: 2
  plugins enable: 2
  plugins disable: 2
  plugins info: 2
  plugins capabilities: 2
  plugins check-updates: 0
  plugins validate: 2
  cron: 2                 # a group with no default action prints its help
  cron create: 2
  cron edit: 2
  cron list: 0            # says there are no jobs yet
  cron pause: 2
  cron resume: 2
  cron run: 2
  cron remove: 2
  cron status: 0
  cron tick: 0            # one pass over an empty store
  cron pause-all: 0
  cron resume-all: 0
  cron runs: 2
  cron history: 0
  cron incidents: 0
  cron notepad: 2
  cron doctor: 0          # no jobs, no findings

  pairing: 0              # no subcommand lists requests and paired users (P15-09)
  pairing list: 0
  pairing approve: 2      # a platform and a code or request id are required
  pairing revoke: 2
  pairing clear-pending: 0

# `long_running`: commands that run until they are stopped (a daemon loop). They cannot meet the
# watchdog with no arguments, so the contract only checks that `--help` answers (exit 0) in time.
long_running:
  - cron daemon

with_arguments:
  auth add openrouter: 1          # no key given and no terminal to ask for one
  profile delete work: 1          # needs -y without a terminal
  sessions delete no-such-id: 1
  import missing.zip: 1
  config set agent.max_turns: 2
  logs -f: 1
  bundles create release: 2       # no --skill and no terminal to ask for the skills
  bundles delete no-such-bundle: 1
  bundles show no-such-bundle: 1
  curator rollback --list: 0
  journey delete ghost: 1          # needs -y without a terminal, then: no such node
  moa delete no-such-preset: 1
  mcp test no-such-server: 1
  mcp configure no-such-server: 1
  mcp remove no-such-server: 1
  hooks revoke deadbeef: 1         # no such approval
  plugins remove ghost: 1          # needs -y without a terminal
  plugins enable ghost: 1
  cron run no-such-job: 1
  cron remove no-such-job -y: 1
  cron notepad no-such-job list: 1
