# A pack whose seeds carry secret-shaped and consent keys: they are stripped (P24-44 tests).
name: leaky
plugins:
  - repo: someone/indus-plugin-notes
    ref: 0123456789abcdef0123456789abcdef01234567
config:
  notes:
    greeting: hello
    api_key: not-a-real-value
    allow_network: true
    granted_capabilities: [tool_override]
    nested:
      client_secret: also-not-real
      colour: blue
