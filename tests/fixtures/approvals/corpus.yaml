# Our own command corpus for dangerous-command detection (P05-07, D-16.76).
#
# Every row: cmd (the command text), verdict (safe | dangerous | hardline) and, unless safe,
# key (the expected Detection.pattern_key). Rows were written for Indus from the behaviours in
# docs/notes/P05/approval-detect.md; none is copied from the reference's tests.
# The test runs detect() with user home /home/dev and Indus home /home/dev/.indus.
# "{U+XXXX}" in a cmd stands for that code point.
# Never loosen a verdict to make the test pass without a note in the task note.

cases:
