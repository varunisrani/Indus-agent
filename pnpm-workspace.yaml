packages:
  - apps/*
  - packages/*

# Refuse any package version published less than 14 days ago (value in minutes).
minimumReleaseAge: 20160

# No dependency may run install scripts unless approved here on purpose.
# `onlyBuiltDependencies` is the spelling the P00-08 spec names (pnpm 10); pnpm 11+ ignores it and
# reads `allowBuilds` instead. node-pty (optional, P12-33 Demo 2 E2E only) compiles its native PTY binding
# on install; it is the only package allowed to. Being optional, a failed build (no node-gyp) skips it
# instead of failing the install; the opt-in e2e lane needs it.
onlyBuiltDependencies:
  - node-pty
allowBuilds:
  node-pty: true
  # electron-builder's tree pulls electron-winstaller (Squirrel.Windows, unused: our Windows targets
  # are NSIS and ZIP); its vendor install script is not needed and stays off (P20-38).
  electron-winstaller: false

# electron-updater (P20-37) reaches sax through builder-util-runtime; sax moved to BlueOak-1.0.0
# (not on licenses_allow.json) after 1.4.1, the last ISC release, which still satisfies `^1.2.4`.
overrides:
  builder-util-runtime>sax: 1.4.1
