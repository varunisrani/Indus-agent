# The user docs site (P25-14). Build: `uv run mkdocs build` (strict is set below, so a broken link,
# a missing anchor or a page left out of the navigation fails the build). Output goes to
# build/docs-site/ (git-ignored) with llms.txt and llms-full.txt written by the hook.
# Generated pages under reference/ come from `python scripts/docs/gen_reference.py`.
site_name: Indus Agent
site_description: An AI agent for your terminal, editor, desktop and chat apps that learns as you use it.
docs_dir: docs/user
site_dir: build/docs-site
strict: true
use_directory_urls: true
# site_url: set once the owner picks the docs domain (P25-20); llms links are site-relative until then.

theme:
  name: material
  # No web fonts: the site loads nothing from third-party hosts.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark colours
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light colours

plugins:
  - search

hooks:
  - scripts/docs/llms_txt.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

